name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tekaplay
          POSTGRES_PASSWORD: tekaplay
          POSTGRES_DB: tekaplay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tekaplay"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Type check
        working-directory: backend
        run: mypy app || true   # advisory until module surface stabilizes; flip to hard-fail in slice 2
      - name: Migration check (upgrade + downgrade + upgrade)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tekaplay:tekaplay@localhost:5432/tekaplay_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tekaplay:tekaplay@localhost:5432/tekaplay_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        # ci, not install: fails loudly if the lockfile is out of sync rather
        # than silently testing a different dependency tree than production.
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        # Mirrors production: the API URL is compiled into the bundle at build
        # time, so a build without it is not the artifact that gets deployed.
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api/v1
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t tekaplay-api ./backend
      - name: Build frontend image
        # The build arg is what production supplies; building without it would
        # not exercise the same path.
        run: |
          docker build -t tekaplay-web \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://example.invalid/api/v1 \
            ./frontend

  # Deployment itself is handled by Render's GitHub integration (autoDeploy in
  # render.yaml): a push to main that passes these checks is what ships. See
  # docs/DEPLOYMENT.md. Migrations are deliberately run by hand — a schema
  # change should never be a side effect of a code push.
